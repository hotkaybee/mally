name: Build and Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/mally

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest image..."
            docker compose -f docker-compose.prod.yml pull

            # Migrations run on start (entrypoint), so back up first.
            if docker compose -f docker-compose.prod.yml ps --status running --services | grep -qx mysql; then
              echo "Backing up the database..."
              mkdir -p backups
              docker compose -f docker-compose.prod.yml exec -T mysql sh -c \
                'exec mysqldump --single-transaction --routines -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
                | gzip > "backups/mally-$(date +%Y%m%d-%H%M%S).sql.gz"
            fi

            echo "Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d

            # The entrypoint migrates and caches config/routes/views; running
            # them again here would race it. Wait until the app answers /up.
            echo "Waiting for the app to become healthy..."
            for i in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' mally-app 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              docker compose -f docker-compose.prod.yml logs --tail=100 app
              exit 1
            fi

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment completed successfully!"
