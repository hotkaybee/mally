[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue.log
stopwaitsecs=3600

[program:laravel-schedule]
command=sh -c 'while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done'
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/schedule.log

; Telegram login bot: long polling so it answers at once. Idles when
; TELEGRAM_AUTH_WEBHOOK_SECRET is set (Telegram then calls the webhook).
[program:telegram-auth-poll]
command=php /var/www/html/artisan telegram:auth-poll
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/telegram-poll.log

; Telegram admin bot: new-order alerts with status buttons, order and SKU
; lookups. Idles when TELEGRAM_BOT_TOKEN / TELEGRAM_ADMIN_CHAT_IDS are empty.
[program:telegram-admin-poll]
command=php /var/www/html/artisan telegram:admin-poll
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/telegram-admin-poll.log
